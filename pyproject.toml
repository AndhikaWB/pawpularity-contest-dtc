[project]
name = "pawpaw"
version = "0.1.0"
description = "MLOps project for pet pawpularity prediction"
requires-python = "==3.12.*"
dependencies = [
    "boto3==1.39.11",
    "fastapi[standard]==0.116.1",
    "kaleido==0.2.1",
    "lakefs==0.12.0",
    "lightning==2.5.2",
    "mlflow==3.2.0",
    "pillow==11.3.0",
    "plotly==5.24.1",
    "polars==1.32.2",
    "psutil==7.0.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "pynvml==12.0.0",
    "python-multipart==0.0.20",
    "streamlit==1.48.0",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "boto3-stubs[essential]==1.39.11",
    "ipykernel==6.30.1",
    "jinja2==3.1.6",
    "nbformat==5.10.4",
    "prefect==3.4.13",
    "pytest==8.4.1",
    "torchinfo==1.8.0",
]
cpu = [
    "torch==2.8.0",
    "torchvision==0.23.0",
]
cuda = [
    "torch==2.8.0",
    "torchvision==0.23.0",
]
monitoring = [
    "nannyml==0.13.1",
    "psycopg2-binary==2.9.10",
    "sqlalchemy==2.0.43",
]

[build-system]
requires = ["uv_build==0.8.9"]
build-backend = "uv_build"

[tool.uv]
build-backend.module-name = ["pawpaw", "pawpaw_prefect"]
# See https://github.com/astral-sh/uv/issues/12558
# Another workaround is by using UV_NO_SYNC
default-groups = []
conflicts = [
    [ { group = "cpu" }, { group = "cuda" } ]
]

[tool.uv.sources]
torch = [ { index = "pytorch-cu128", group = "cuda" } ]
torchvision = [ { index = "pytorch-cu128", group = "cuda" } ]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 88
indent-width = 4
lint.select = [
    "E501", # line-too-long
    "W505", # doc-line-too-long
    "PTH" # flake8-use-pathlib
]
lint.ignore = [
    "PTH123" # builtin-open
]

[tool.ruff.lint.per-file-ignores]
"src/pawpaw*/pydantic_/*" = [
    "E501" # line-too-long
]

# [tool.pyright]
# typeCheckingMode = "strict"